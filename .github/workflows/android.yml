name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Provide placeholder secrets
        run: |
          cat > local.properties <<'EOF'
          TMDB_API_KEY=
          TMDB_BEARER=
          INDEXER_BASE_URL=https://torrentio.strem.fun/
          GOOGLE_WEB_CLIENT_ID=
          EOF

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --stacktrace
