name: Release

# Push a tag like v1.1.2 (or run manually) -> builds a signed, minified release APK,
# auto-increments versionCode, and publishes the APK + update.json so the in-app updater
# picks it up. Requires repo secrets: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS,
# TMDB_API_KEY, TMDB_BEARER, GOOGLE_WEB_CLIENT_ID.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      versionName:
        description: 'Version name, e.g. 1.1.2'
        required: true
        default: ''

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$GITHUB_WORKSPACE/slickstream-release.jks"

      - name: Restore google-services.json for Firebase
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > "$GITHUB_WORKSPACE/app/google-services.json"

      - name: Compute version
        id: ver
        run: |
          VC=$((1000 + GITHUB_RUN_NUMBER))
          if [ "${{ github.event_name }}" = "push" ]; then
            VN="${GITHUB_REF_NAME#v}"
          else
            VN="${{ github.event.inputs.versionName }}"
          fi
          echo "vc=$VC" >> "$GITHUB_OUTPUT"
          echo "vn=$VN" >> "$GITHUB_OUTPUT"
          echo "tag=v${VN}" >> "$GITHUB_OUTPUT"
          echo "Building versionCode=$VC versionName=$VN"
          # Plain-English release notes = the ANNOTATED tag's own message (NOT the commit message).
          # Force-fetch the tag object first (checkout can leave a peeled/lightweight ref), then read
          # the annotation body via `git tag -l --format`.
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}" 2>/dev/null || true
          NOTES=$(git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" 2>/dev/null | sed '/^-----BEGIN/,$d')
          if [ -z "${NOTES//[[:space:]]/}" ]; then NOTES="What's new:
          - Improvements and fixes"; fi
          printf '%s\n' "$NOTES" > notes.txt
          echo "----- release notes -----"; cat notes.txt

      - name: Build signed release
        env:
          RELEASE_STORE_FILE: slickstream-release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_BEARER: ${{ secrets.TMDB_BEARER }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease \
            -PversionCode=${{ steps.ver.outputs.vc }} \
            -PversionName=${{ steps.ver.outputs.vn }} \
            --no-daemon --stacktrace

      - name: Stage assets + manifest
        run: |
          cp app/build/outputs/apk/release/app-release.apk slickstream.apk
          SHA=$(sha256sum slickstream.apk | awk '{print $1}')
          # jq --rawfile JSON-escapes the multi-line plain-English notes safely.
          jq -n \
            --argjson vc ${{ steps.ver.outputs.vc }} \
            --arg vn "${{ steps.ver.outputs.vn }}" \
            --arg url "https://github.com/${{ github.repository }}/releases/latest/download/slickstream.apk" \
            --rawfile notes notes.txt \
            --arg sha "$SHA" \
            '{versionCode:$vc, versionName:$vn, apkUrl:$url, notes:$notes, mandatory:false, sha256:$sha}' > update.json
          echo "sha256=$SHA"; cat update.json

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          gh release create "$TAG" slickstream.apk update.json \
            --repo "${{ github.repository }}" \
            --title "SlickStream ${{ steps.ver.outputs.vn }}" \
            --notes-file notes.txt \
          || gh release upload "$TAG" slickstream.apk update.json --clobber --repo "${{ github.repository }}"
